<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>メッセージ送信｜JCP飯田下伊那</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>日本共産党 飯田下伊那地区</h1>
  </header>

  <main>
    <h2>なんでもメッセージ</h2>

    <div class="description">
      <p>生活で困っていること、政治への要望、共産党に質問したいことなど――。</p>
      <p>共産党・飯田下伊那地区へのメッセージをなんでも送ってください。</p>
    </div>

    <form class="form" action="https://hyperform.jp/api/t9ogOhye"  method="post">
      <div class="form-group">
        <label for="message">メッセージ <span class="required">*</span></label>
        <textarea name="message" rows="6" placeholder="メッセージをご記入ください" required></textarea>
      </div>
      <div class="form-group">
        <label for="name">お名前</label>
        <input type="text" name="name" placeholder="匿名でもかまいません">
      </div>
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="text" name="email" placeholder="返信を期待する場合にご記入ください">
      </div>
      <div class="form-group">
        <label for="phone">電話番号</label>
        <input type="text" name="phone" placeholder="電話連絡を期待する場合にご記入ください">
      </div>
      <p class="privacy-notice">記載いただいた個人情報は、メッセージに関するご連絡のみに利用し、第三者に提供することはありません。</p>
      <div class="form-group control">
        <button type="submit">送信</button>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; 日本共産党 飯田下伊那地区　2026年5月更新</p>
  </footer>
</body>

</html>
